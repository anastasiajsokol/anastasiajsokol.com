            <script>
                /**
                 *  Replace static random order with dynamic random order
                **/
                function shuffle(array){
                    for(let i = 0; i < array.length; ++i){
                        let swapindex = Math.floor(Math.random() * array.length);
                        let tmp = array[i]; array[i] = array[swapindex]; array[swapindex] = tmp;
                    }
                    return array;
                }

                const images = document.getElementById("images");

                images.replaceChildren(...shuffle(new Array(...images.children)));
            </script>
